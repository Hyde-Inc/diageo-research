[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diageo-research"
version = "0.1.0"
description = "STORM-style multi-perspective research agent for Diageo strategy (North America)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Diageo Research Demo" }]
dependencies = [
  "anthropic>=0.40.0",
  "browser-use>=0.1.40",
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sse-starlette>=2.1.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pyarrow>=17.0.0",
  "pandas>=2.2.0",
  "pytrends>=4.9.2",
  "dagster>=1.13",
  "mcp>=1.27",
  "dagster-webserver>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[project.scripts]
diageo = "diageo_research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/diageo_research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
