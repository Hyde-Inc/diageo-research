# Sample strategy questions for the Diageo demo. Pass any of these to
# `diageo research "<question>"` or paste into the web UI.

- Where are recent price changes having the biggest impact on North American spirits demand?
- How do drinking occasions shift during U.S. festivals and Canadian long weekends?
- Which premium tequila SKUs are losing share to RTD competitors on the West Coast?
- What is the cross-elasticity between Crown Royal and competing Canadian whiskies after the 2024 price moves?
- How are Gen Z low/no-ABV preferences reshaping our Smirnoff portfolio in North America?
- Which U.S. states show the strongest organic growth signal for Don Julio 1942 versus promo-driven lift?
- How do TTB and state-level regulatory shifts threaten our North American distribution roadmap?
- What supply-chain risks (agave, glass, freight) most affect North American margin over the next four quarters?
- Where do on-premise vs off-premise mix shifts create the biggest revenue swings post-pandemic?
- How does Hispanic-heritage marketing performance differ across Texas, California, and Florida?
