# fly.toml — Diageo Research sidecar
#
# Single always-on machine because the research runs are 8–13 min SSE streams
# that can't survive auto_stop. Volume is mounted for per-run artifacts so
# `/research/{id}/stream`, `/research/{id}/report`, etc. keep working across
# restarts.

app = "diageo-research-agathwala"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/app/data"
  DUCKDB_PATH = "/tmp/main.duckdb"
  RUNS_DIR = "/data/runs"
  BROWSER_USE_MAX_CONCURRENCY = "3"
  BROWSER_USE_TIMEOUT_S = "90"
  PARALLEL_PERSONA_LIMIT = "6"
  PARALLEL_SECTION_LIMIT = "6"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[mounts]
  source = "diageo_research_runs"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
