# Dagster instance configuration.
#
# Picked up by Dagster whenever $DAGSTER_HOME points at this directory's
# parent (the repo root). All storage providers persist into the
# DAGSTER_HOME directory, so run history, asset materializations,
# compute logs, schedules, and sensor state survive process restarts
# and are visible in the Dagit UI.
#
# Run-time entry points:
#   - `diageo dagster-dev` (sets DAGSTER_HOME=./.dagster_home for you)
#   - `DAGSTER_HOME=$(pwd)/.dagster_home uv run dagster dev -w workspace.yaml`
#
# Keep this in sync with the Dagster version pinned in pyproject.toml
# (1.13.x as of this writing). The class paths below are valid for
# dagster 1.13.6.

telemetry:
  enabled: false

run_storage:
  module: dagster._core.storage.runs
  class: SqliteRunStorage
  config:
    base_dir:
      env: DAGSTER_HOME

event_log_storage:
  module: dagster._core.storage.event_log
  class: SqliteEventLogStorage
  config:
    base_dir:
      env: DAGSTER_HOME

schedule_storage:
  module: dagster._core.storage.schedules
  class: SqliteScheduleStorage
  config:
    base_dir:
      env: DAGSTER_HOME

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir:
      env: DAGSTER_HOME

local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir:
      env: DAGSTER_HOME
